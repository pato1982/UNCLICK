<!DOCTYPE html>
<html class="light" lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LocalClick — Marketplace local de Villarrica</title>
    <meta name="description" content="LocalClick es el marketplace local de Villarrica y sus alrededores: productos, servicios, arriendos, turismo, eventos y locales. Todo lo que necesitas está a un Click." />
    <meta name="theme-color" content="#3B1969" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="canonical" href="https://localclick.cl/" />

    <!-- Open Graph (Facebook, WhatsApp, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LocalClick" />
    <meta property="og:title" content="LocalClick — Marketplace local de Villarrica" />
    <meta property="og:description" content="Productos, servicios, arriendos, turismo, eventos y locales de Villarrica y sus alrededores. Todo a un Click." />
    <meta property="og:url" content="https://localclick.cl/" />
    <meta property="og:image" content="https://localclick.cl/icon-512.png" />
    <meta property="og:locale" content="es_CL" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LocalClick — Marketplace local de Villarrica" />
    <meta name="twitter:description" content="Productos, servicios, arriendos, turismo, eventos y locales de Villarrica y sus alrededores." />
    <meta name="twitter:image" content="https://localclick.cl/icon-512.png" />

    <!-- Conexion temprana a los CDN de fuentes (acelera el primer render) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Fuentes cargadas de forma NO bloqueante (media=print -> all on load) -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0&display=block"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
      <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0&display=block" rel="stylesheet" />
    </noscript>

    <!-- Precarga de la imagen LCP (primer slide del hero), coincide con el srcset del HeroBanner -->
    <link
      rel="preload"
      as="image"
      href="/hero/hero1-1280.webp"
      imagesrcset="/hero/hero1-640.webp 640w, /hero/hero1-1280.webp 1280w"
      imagesizes="100vw"
      fetchpriority="high"
    />
  </head>
  <body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 font-display">
    <div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
  </body>
</html>
